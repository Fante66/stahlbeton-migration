# Speicherort für Passwörter und geheime Schlüssel
apiVersion: v1
kind: Secret
metadata:
  name: datenbank-geheimnis
  namespace: stahlbeton-sm0810
type: Opaque
stringData:
  db_root_password: "StahlbetonSicher2026!"
  db_password: "WordPressSicher2026!"
---
# Digitale Schutzwand für die Datenbank (Sicherheits-Regelwerk)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datenbank-schutzwand
  namespace: stahlbeton-sm0810
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Erlaube Zugriff nur von der Haupt-Webseite (WordPress)
    - podSelector:
        matchLabels:
          app: wordpress
    # Erlaube Zugriff auch vom neuen Verwaltungs-Werkzeug (phpMyAdmin)
    - podSelector:
        matchLabels:
          app: phpmyadmin
---
# Der Datenbank-Server (MariaDB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-computer
  namespace: stahlbeton-sm0810
spec:
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      securityContext:
        # Sicherheit: Nicht als mächtiger Chef-Nutzer (Root) ausführen
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: mariadb
        image: mariadb:10.6
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datenbank-geheimnis
              key: db_root_password
        - name: MARIADB_DATABASE
          value: wordpress_db
        - name: MARIADB_USER
          value: wp_nutzer
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datenbank-geheimnis
              key: db_password
        ports:
        - containerPort: 3306
          name: mariadb
---
# Interner Anschluss für die Datenbank
apiVersion: v1
kind: Service
metadata:
  name: datenbank-anschluss
  namespace: stahlbeton-sm0810
spec:
  ports:
  - port: 3306
  selector:
    app: mariadb
---
# Die Haupt-Webseite (WordPress)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-computer
  namespace: stahlbeton-sm0810
spec:
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: wordpress
        image: bitnami/wordpress:latest
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: WORDPRESS_DATABASE_HOST
          value: datenbank-anschluss
        - name: WORDPRESS_DATABASE_NAME
          value: wordpress_db
        - name: WORDPRESS_DATABASE_USER
          value: wp_nutzer
        - name: WORDPRESS_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datenbank-geheimnis
              key: db_password
        ports:
        - containerPort: 8080
          name: wordpress
---
# Interner Anschluss für WordPress
apiVersion: v1
kind: Service
metadata:
  name: webseite-anschluss
  namespace: stahlbeton-sm0810
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: wordpress
  type: ClusterIP
---
# Das Datenbank-Verwaltungs-Werkzeug (phpMyAdmin)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin-computer
  namespace: stahlbeton-sm0810
spec:
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: phpmyadmin
        # HIER REPARIERT: Feste Version 5 statt 'latest' gewählt, da vorhanden
        image: bitnami/phpmyadmin:5
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: DATABASE_HOST
          value: datenbank-anschluss
        ports:
        - containerPort: 8080
          name: phpmyadmin
---
# Interner Anschluss für das Verwaltungs-Werkzeug
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-anschluss
  namespace: stahlbeton-sm0810
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: phpmyadmin
  type: ClusterIP
---
# Der digitale Pförtner (Ingress) - Regelt die Wegeleitung über eine einzige IP
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stahlbeton-pfoertner
  namespace: stahlbeton-sm0810
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Regel 1: Der normale Aufruf (/) zeigt das WordPress an
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webseite-anschluss
            port:
              number: 80
      # Regel 2: Der Aufruf mit /phpmyadmin leitet zum Verwaltungs-Werkzeug weiter
      - path: /phpmyadmin
        pathType: Prefix
        backend:
          service:
            name: phpmyadmin-anschluss
            port:
              number: 80